name: Install build dependencies
description: >
  The apt packages every job that compiles something needs, in one
  place. Jobs needing more pass them in rather than writing their own
  install step, so the base list moves once.

inputs:
  extra:
    description: Further packages, space separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake libpcre2-dev zlib1g-dev ${{ inputs.extra }}
