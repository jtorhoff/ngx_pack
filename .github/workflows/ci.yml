name: CI

env:
  NGINX_REF: stable-1.30

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build with ${{ matrix.cc }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # One compiler failing should not hide the other, and neither
      # architecture should hide the other.
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      - name: Build nginx
        run: script/build/build.sh

      - name: Prepare fixtures
        run: script/tests/basic/prepare-tests.sh

      - name: Static files and Accept-Encoding
        run: script/tests/basic/run-tests.sh

      - name: Streaming responses and encoder lifetime
        run: python3 script/tests/stream/test_stream.py --nginx nginx/objs/nginx

      # Builds a second nginx of its own, carrying
      # script/tests/header_status/fault_filter alongside this module:
      # the filter sends held headers from inside the body filter, and
      # nothing in nginx's tree can return a status to that call -
      # ngx_http_image_filter_module is the only header filter that
      # returns one, and only when Content-Length is known, which this
      # path never is. The driver makes its own fixtures.
      - name: Rejected-header handling
        run: script/tests/header_status/test-header-status.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  sanitizers:
    name: Run tests with address sanitizer (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      - name: Build nginx with AddressSanitizer
        run: |
          git clone --depth 1 --branch $NGINX_REF \
              https://github.com/nginx/nginx.git nginx
          cd nginx
          CC_OPT="-fsanitize=address -fno-omit-frame-pointer -g -O1"
          ./auto/configure \
              --prefix="$GITHUB_WORKSPACE/script/test" \
              --with-http_v2_module \
              --with-debug \
              --with-cc-opt="$CC_OPT" \
              --with-ld-opt="-fsanitize=address" \
              --add-module="$GITHUB_WORKSPACE"
          make -j "$(nproc)"

      - name: Streaming suite under AddressSanitizer
        # Leaks are nginx's pools rather than anything this module
        # owns, and the module's own balance is asserted by the
        # suite itself.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: python3 script/tests/stream/test_stream.py --nginx nginx/objs/nginx

  undefined-behavior:
    name: Run tests with undefined behavior sanitizer (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      - name: Build nginx with UndefinedBehaviorSanitizer
        run: |
          git clone --depth 1 --branch $NGINX_REF \
              https://github.com/nginx/nginx.git nginx
          cd nginx
          CC_OPT="-fsanitize=undefined -fno-omit-frame-pointer -g -O1"
          ./auto/configure \
              --prefix="$GITHUB_WORKSPACE/script/test" \
              --with-http_v2_module \
              --with-debug \
              --with-cc-opt="$CC_OPT" \
              --with-ld-opt="-fsanitize=undefined" \
              --add-module="$GITHUB_WORKSPACE"
          make -j "$(nproc)"

      # log_path rather than stderr: nginx redirects stderr into its own
      # error log, which the driver deletes with the work directory when
      # everything passes - so reports would vanish exactly when nothing
      # else failed. This writes them beside the workspace instead.
      # halt_on_error stays off so one report does not hide the rest.
      - name: Streaming suite under UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:log_path=/tmp/ubsan
        run: python3 script/tests/stream/test_stream.py --nginx nginx/objs/nginx

      - name: Fail on undefined behavior in this module
        run: |
          reports=$(cat /tmp/ubsan.* 2>/dev/null | grep "runtime error" || true)
          if [ -z "$reports" ]; then
            echo "no reports at all"
            exit 0
          fi
          echo "$reports"
          # nginx raises a few of its own - ngx_http_huff_encode, and a
          # version shift in ngx_posix_init and ngx_process_cycle - so
          # the gate is reports naming this module, not any report.
          mine=$(printf '%s\n' "$reports" \
                 | grep -e ngx_http_zstd -e ngx_http_fault || true)
          if [ -n "$mine" ]; then
            echo "::error::undefined behavior reported in this module"
            exit 1
          fi
          echo "none of them name this module"

  release:
    name: Build and test without --with-debug (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      # Every other job builds --with-debug, so nothing here has ever
      # been compiled with NGX_DEBUG off. That hides a whole class of
      # break: ngx_log_debug* expands to nothing without it, so a
      # variable read only by a debug call is set-but-unused, and
      # -Werror rejects it. One such error reached the tree and every
      # existing job passed.
      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      - name: Build nginx without --with-debug
        env:
          WITH_DEBUG: "0"
        run: script/build/build.sh

      - name: Prepare fixtures
        run: script/tests/basic/prepare-tests.sh

      - name: Static files and Accept-Encoding
        run: script/tests/basic/run-tests.sh

      # Also the only run of these against optimised, non-debug code.
      # The nine window and memory tests read the encoder's allocator
      # tracing out of the debug log, so the driver skips them here
      # and reports them as skipped rather than passing.
      - name: Streaming responses and encoder lifetime
        run: python3 script/tests/stream/test_stream.py --nginx nginx/objs/nginx

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  small-buffer:
    name: Run tests with a 64-byte output buffer (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      # For libzstd and the zstd CLI the suites decompress with;
      # test-small-buffer.sh builds only its own nginx tree.
      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      # No "script/build/build.sh" step here, deliberately: it would build an
      # ordinary nginx that nothing in this job ever runs.
      # test-small-buffer.sh clones and builds nginx-small-buffer of its
      # own and points both suites at that binary, by NGINX_BIN for the
      # shell suite and --nginx for the streaming one, so neither can
      # fall back to nginx/objs/nginx. The libraries it does need come
      # from the cached step above.
      #
      # The fixtures below are not the same story: test-small-buffer.sh
      # runs the shell suite, which serves them.
      - name: Prepare fixtures
        run: script/tests/basic/prepare-tests.sh

      # Under AddressSanitizer, since the point of the tiny buffer is
      # to make the partial-drain and resend paths dense and those are
      # where a buffer overrun would live. Leaks are nginx's pools
      # rather than anything this module owns, and the module's own
      # balance is asserted by the suite itself.
      - name: Both suites at a 64-byte output buffer
        env:
          SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: script/tests/stream/test-small-buffer.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  out-of-memory:
    name: Run the out-of-memory paths (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps

      # For libzstd; test-oom.sh builds its own nginx tree, with the
      # allocation-fault hook compiled in.
      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      # Neither a "script/build/build.sh" nor a "prepare-tests.sh" step here,
      # deliberately. test-oom.sh builds nginx-oom and hands that binary
      # to test_oom.py, which calls build_fixtures() for a fixture tree
      # of its own - so an ordinary nginx and the shell suite's fixtures
      # are both dead weight, the latter including a download from
      # gutenberg.org this job would otherwise have to survive.

      # The branches taken when libzstd cannot get memory. Nothing else
      # reaches them: a test cannot make malloc fail for one module and
      # not the rest of the worker.
      - name: Refused allocations
        run: script/tests/oom/test-oom.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  fuzz:
    name: Fuzz the Accept-Encoding parser (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libclang-rt-dev carries the sanitizer and libFuzzer
      # runtimes. The clang package alone accepts -fsanitize=fuzzer
      # and then fails at link with
      # "cannot find .../libclang_rt.fuzzer-<arch>.a".
      - name: Install build dependencies
        uses: ./.github/actions/build-deps
        with:
          # libFuzzer needs clang and its runtime; the clang package
          # alone leaves the sanitizer archive missing at link time.
          extra: clang libclang-rt-dev

      # The targets include nginx's headers and compile its
      # ngx_string.c, so they need a configured tree. Reusing
      # build.sh keeps this job on the same nginx as the rest of the
      # workflow, at the cost of also building zstd, which the
      # fuzzers do not link.
      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      - name: Build nginx
        run: script/build/build.sh

      - name: Build the fuzz targets
        env:
          CC: clang
        run: script/fuzz/build.sh

      # Deterministic, and the part that is a regression test: every
      # seed is replayed once and a crash fails the job. -runs=0
      # replays without mutating, so it never writes to the tracked
      # seed corpus.
      - name: Replay the seed corpus
        run: |
          script/fuzz/out/fuzz_accept_encoding -runs=0 \
            script/fuzz/corpus

      # Exploratory, and time-boxed. New inputs go to a scratch
      # directory given first, so a run cannot rewrite the seeds.
      - name: Fuzz for one minute
        run: |
          mkdir -p script/fuzz/out/corpus
          script/fuzz/out/fuzz_accept_encoding \
            -max_total_time=60 -print_final_stats=1 \
            -dict=script/fuzz/accept_encoding.dict \
            script/fuzz/out/corpus script/fuzz/corpus

      # A finding is only useful if it can be reproduced, and
      # libFuzzer writes the input beside the binary as
      # crash-<sha1>.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  analyze:
    name: Static analysis with clang (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: ./.github/actions/build-deps
        with:
          extra: clang

      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      # The analyser takes its flags from the tree this leaves behind, so
      # it must be configured the way the module ships - and configured
      # with clang, since those flags are handed back to clang.
      - name: Build nginx with clang
        env:
          CC: clang
        run: script/build/build.sh

      # Analyses only the five files this repository owns. Findings in
      # nginx or in deps/ are not ours to answer for, and filtering them
      # out of a whole-build report by path is how a job like this rots
      # into always-green. See the script.
      - name: Analyse this module
        env:
          CLANG: clang
        run: script/build/analyze.sh

  coverage:
    name: Report test coverage (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libclang-rt-dev carries the profiling runtime
      # -fprofile-instr-generate links against, the same package the
      # fuzz job needs for its sanitizer runtimes; llvm carries
      # llvm-profdata and llvm-cov.
      - name: Install build dependencies
        uses: ./.github/actions/build-deps
        with:
          extra: clang libclang-rt-dev llvm

      - name: Build the vendored libraries
        uses: ./.github/actions/build-libs

      # Report-only: nothing here fails the build. See the script for
      # why a coverage floor is not what this is building toward yet.
      - name: Build an instrumented nginx and report coverage
        env:
          CC: clang
        run: script/build/coverage.sh

  types:
    name: Type-check the Python scripts
    # One runner, as for shellcheck: pyright reads the sources and its
    # verdict does not depend on the architecture underneath.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned, and deliberately. pyright adds checks between releases, so
      # an unpinned one turns this job red on somebody else's release day
      # rather than on a change made here. NGINX_REF above is pinned for
      # the same reason. Raise it on purpose, with the findings in hand.
      - name: Install pyright
        run: npm install -g pyright@1.1.413

      # Settings come from pyrightconfig.json rather than flags, so the
      # editor and this job check the same thing: Pylance is pyright
      # underneath and reads that same file.
      - name: Check the scripts
        run: |
          pyright --version
          pyright --outputjson > /tmp/pyright.json || true
          python3 - <<'EOF'
          import json, sys
          report = json.load(open("/tmp/pyright.json"))
          summary = report["summary"]
          for d in report["generalDiagnostics"]:
              start = d["range"]["start"]
              print(f"::error file={d['file']},line={start['line'] + 1}::"
                    f"{d['rule'] if 'rule' in d else d['severity']}: {d['message']}")
          print(f"{summary['filesAnalyzed']} files, "
                f"{summary['errorCount']} errors, "
                f"{summary['warningCount']} warnings")
          sys.exit(1 if summary["errorCount"] or summary["warningCount"] else 0)
          EOF

  shellcheck:
    name: Lint the shell scripts
    # One runner is enough: shellcheck reads the scripts, so the result
    # does not depend on the architecture underneath it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      # Found rather than listed, so a script added later is covered
      # without anyone remembering to name it here - a lint job that
      # quietly stops covering things is worse than none.
      #
      # Default severity, which is already everything from errors down to
      # style. Not "-o all": that turns on the optional checks, and they
      # ask for braces around every variable and [[ ]] over [ ] - some 350
      # findings across these ten files, none of them bugs, all of them
      # against the idiom the scripts are written in.
      - name: Check the scripts
        run: |
          shellcheck --version | grep version:
          mapfile -t scripts < <(find script -name '*.sh' -type f | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found under script/"
            exit 1
          fi
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  format:
    name: Check formatting with clang-format (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Newer than the other jobs on purpose: .clang-format sets
        # AlignFunctionDeclarations, added in clang-format 19, and
        # 24.04 ships 18.
        platform:
          - { name: linux/amd64, runner: ubuntu-26.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          # Printed so a failing run shows the version. The config
          # needs 19 or newer; an unknown key is rejected outright
          # rather than ignored.
          clang-format --version
          # deps/ is vendored and formats to its own conventions.
          clang-format --dry-run --Werror \
            module/common/*.h module/filter/*/*.c module/static/*.c \
            script/fuzz/*.c
