name: CI

env:
  NGINX_REF: stable-1.30

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build with ${{ matrix.cc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One compiler failing should not hide the other, and neither
      # architecture should hide the other.
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      - name: Build zstd and nginx
        run: script/build.sh

      - name: Prepare fixtures
        run: script/prepare-tests.sh

      - name: Static files and Accept-Encoding
        run: script/run-tests.sh

      - name: Streaming responses and encoder lifetime
        run: python3 script/test_stream.py --nginx nginx/objs/nginx

      # Builds a second nginx of its own, carrying script/fault_filter
      # alongside this module: the filter sends held headers from
      # inside the body filter, and nothing in nginx's tree can return
      # a status to that call - ngx_http_image_filter_module is the
      # only header filter that returns one, and only when
      # Content-Length is known, which this path never is. The driver
      # makes its own fixtures.
      - name: Rejected-header handling
        run: script/test-header-status.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  sanitizers:
    name: Run tests with address sanitizer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      # This job and the other sanitizer one build the libraries
      # themselves rather than running script/build.sh, because that
      # script builds nginx too and these need it configured with
      # sanitizer flags. Both libraries are built plain: the sanitizer
      # is here for this module's code, and instrumenting a vendored
      # dependency only adds noise to look past.
      #
      # Kept as two steps so a failure names the library that failed.
      - name: Build zstd
        run: |
          cmake -S deps/zstd/build/cmake -B deps/zstd/out \
                -DCMAKE_BUILD_TYPE=Release \
                -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF \
                -DZSTD_BUILD_PROGRAMS=OFF \
                -DZSTD_MULTITHREAD_SUPPORT=OFF \
                -DZSTD_LEGACY_SUPPORT=OFF
          cmake --build deps/zstd/out --target libzstd_static -j "$(nproc)"

      - name: Build Brotli
        run: |
          cmake -S deps/brotli -B deps/brotli/out \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DBROTLI_BUILD_TOOLS=OFF \
                -DBROTLI_DISABLE_TESTS=ON
          cmake --build deps/brotli/out --target brotlienc -j "$(nproc)"

      - name: Build nginx with AddressSanitizer
        run: |
          git clone --depth 1 --branch $NGINX_REF \
              https://github.com/nginx/nginx.git nginx
          cd nginx
          CC_OPT="-fsanitize=address -fno-omit-frame-pointer -g -O1"
          ./auto/configure \
              --prefix="$GITHUB_WORKSPACE/script/test" \
              --with-http_v2_module \
              --with-debug \
              --with-cc-opt="$CC_OPT" \
              --with-ld-opt="-fsanitize=address" \
              --add-module="$GITHUB_WORKSPACE"
          make -j "$(nproc)"

      - name: Streaming suite under AddressSanitizer
        # Leaks are nginx's pools rather than anything this module
        # owns, and the module's own balance is asserted by the
        # suite itself.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: python3 script/test_stream.py --nginx nginx/objs/nginx

  undefined-behavior:
    name: Run tests with undefined behavior sanitizer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      # This job and the other sanitizer one build the libraries
      # themselves rather than running script/build.sh, because that
      # script builds nginx too and these need it configured with
      # sanitizer flags. Both libraries are built plain: the sanitizer
      # is here for this module's code, and instrumenting a vendored
      # dependency only adds noise to look past.
      #
      # Kept as two steps so a failure names the library that failed.
      - name: Build zstd
        run: |
          cmake -S deps/zstd/build/cmake -B deps/zstd/out \
                -DCMAKE_BUILD_TYPE=Release \
                -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF \
                -DZSTD_BUILD_PROGRAMS=OFF \
                -DZSTD_MULTITHREAD_SUPPORT=OFF \
                -DZSTD_LEGACY_SUPPORT=OFF
          cmake --build deps/zstd/out --target libzstd_static -j "$(nproc)"

      - name: Build Brotli
        run: |
          cmake -S deps/brotli -B deps/brotli/out \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DBROTLI_BUILD_TOOLS=OFF \
                -DBROTLI_DISABLE_TESTS=ON
          cmake --build deps/brotli/out --target brotlienc -j "$(nproc)"

      - name: Build nginx with UndefinedBehaviorSanitizer
        run: |
          git clone --depth 1 --branch $NGINX_REF \
              https://github.com/nginx/nginx.git nginx
          cd nginx
          CC_OPT="-fsanitize=undefined -fno-omit-frame-pointer -g -O1"
          ./auto/configure \
              --prefix="$GITHUB_WORKSPACE/script/test" \
              --with-http_v2_module \
              --with-debug \
              --with-cc-opt="$CC_OPT" \
              --with-ld-opt="-fsanitize=undefined" \
              --add-module="$GITHUB_WORKSPACE"
          make -j "$(nproc)"

      # log_path rather than stderr: nginx redirects stderr into its own
      # error log, which the driver deletes with the work directory when
      # everything passes - so reports would vanish exactly when nothing
      # else failed. This writes them beside the workspace instead.
      # halt_on_error stays off so one report does not hide the rest.
      - name: Streaming suite under UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:log_path=/tmp/ubsan
        run: python3 script/test_stream.py --nginx nginx/objs/nginx

      - name: Fail on undefined behavior in this module
        run: |
          reports=$(cat /tmp/ubsan.* 2>/dev/null | grep "runtime error" || true)
          if [ -z "$reports" ]; then
            echo "no reports at all"
            exit 0
          fi
          echo "$reports"
          # nginx raises a few of its own - ngx_http_huff_encode, and a
          # version shift in ngx_posix_init and ngx_process_cycle - so
          # the gate is reports naming this module, not any report.
          mine=$(printf '%s\n' "$reports" \
                 | grep -e ngx_http_zstd -e ngx_http_fault || true)
          if [ -n "$mine" ]; then
            echo "::error::undefined behavior reported in this module"
            exit 1
          fi
          echo "none of them name this module"

  release:
    name: Build and test without --with-debug on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      # Every other job builds --with-debug, so nothing here has ever
      # been compiled with NGX_DEBUG off. That hides a whole class of
      # break: ngx_log_debug* expands to nothing without it, so a
      # variable read only by a debug call is set-but-unused, and
      # -Werror rejects it. One such error reached the tree and every
      # existing job passed.
      - name: Build zstd and nginx without --with-debug
        env:
          WITH_DEBUG: "0"
        run: script/build.sh

      - name: Prepare fixtures
        run: script/prepare-tests.sh

      - name: Static files and Accept-Encoding
        run: script/run-tests.sh

      # Also the only run of these against optimised, non-debug code.
      # The nine window and memory tests read the encoder's allocator
      # tracing out of the debug log, so the driver skips them here
      # and reports them as skipped rather than passing.
      - name: Streaming responses and encoder lifetime
        run: python3 script/test_stream.py --nginx nginx/objs/nginx

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  small-buffer:
    name: Run tests with a 64-byte output buffer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      # For libzstd and the zstd CLI the suites decompress with;
      # test-small-buffer.sh builds only its own nginx tree.
      - name: Build zstd and nginx
        run: script/build.sh

      - name: Prepare fixtures
        run: script/prepare-tests.sh

      # Under AddressSanitizer, since the point of the tiny buffer is
      # to make the partial-drain and resend paths dense and those are
      # where a buffer overrun would live. Leaks are nginx's pools
      # rather than anything this module owns, and the module's own
      # balance is asserted by the suite itself.
      - name: Both suites at a 64-byte output buffer
        env:
          SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: script/test-small-buffer.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  out-of-memory:
    name: Run the out-of-memory paths on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libpcre3-dev zlib1g-dev

      # For libzstd; test-oom.sh builds its own nginx tree, with the
      # allocation-fault hook compiled in.
      - name: Build zstd and nginx
        run: script/build.sh

      - name: Prepare fixtures
        run: script/prepare-tests.sh

      # The branches taken when libzstd cannot get memory. Nothing else
      # reaches them: a test cannot make malloc fail for one module and
      # not the rest of the worker.
      - name: Refused allocations
        run: script/test-oom.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          for log in script/test/logs/*.log script/test/*.log; do
            [ -s "$log" ] || continue
            echo "===== $log"
            tail -n 100 "$log"
          done

  fuzz:
    name: Fuzz the Accept-Encoding parser on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither architecture should hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libclang-rt-dev carries the sanitizer and libFuzzer
      # runtimes. The clang package alone accepts -fsanitize=fuzzer
      # and then fails at link with
      # "cannot find .../libclang_rt.fuzzer-<arch>.a".
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev cmake libpcre3-dev zlib1g-dev

      # The targets include nginx's headers and compile its
      # ngx_string.c, so they need a configured tree. Reusing
      # build.sh keeps this job on the same nginx as the rest of the
      # workflow, at the cost of also building zstd, which the
      # fuzzers do not link.
      - name: Build zstd and nginx
        run: script/build.sh

      - name: Build the fuzz targets
        env:
          CC: clang
        run: script/fuzz/build.sh

      # Deterministic, and the part that is a regression test: every
      # seed is replayed once and a crash fails the job. -runs=0
      # replays without mutating, so it never writes to the tracked
      # seed corpus.
      - name: Replay the seed corpus
        run: |
          script/fuzz/out/fuzz_accept_encoding -runs=0 \
            script/fuzz/corpus

      # Exploratory, and time-boxed. New inputs go to a scratch
      # directory given first, so a run cannot rewrite the seeds.
      - name: Fuzz for two minutes
        run: |
          mkdir -p script/fuzz/out/corpus
          script/fuzz/out/fuzz_accept_encoding \
            -max_total_time=120 -print_final_stats=1 \
            -dict=script/fuzz/accept_encoding.dict \
            script/fuzz/out/corpus script/fuzz/corpus

      # A finding is only useful if it can be reproduced, and
      # libFuzzer writes the input beside the binary as
      # crash-<sha1>.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  format:
    name: Check formatting with clang-format on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newer than the other jobs on purpose: .clang-format sets
        # AlignFunctionDeclarations, added in clang-format 19, and
        # 24.04 ships 18.
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          # Printed so a failing run shows the version. The config
          # needs 19 or newer; an unknown key is rejected outright
          # rather than ignored.
          clang-format --version
          # deps/ is vendored and formats to its own conventions.
          clang-format --dry-run --Werror \
            module/common/*.h module/filter/*/*.c module/static/*.c \
            script/fuzz/*.c
