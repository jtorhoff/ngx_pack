events {
  worker_connections 4;
}

daemon on;
error_log /dev/stdout info;

http {
  access_log ./access.log;
  error_log ./error.log;

  gzip on;
  gzip_comp_level 1;
  gzip_types text/plain text/css;

  zstd on;
  zstd_comp_level 1;
  zstd_types text/plain text/css;
  # The fixtures here are a couple of dozen bytes; this suite is about
  # Accept-Encoding parsing, not the length threshold, so keep the old
  # default rather than the compiled-in 256.
  zstd_min_length 20;

  server {
    listen 8080;
    listen [::]:8080;
    # The "listen ... http2" parameter this replaces was deprecated
    # in 1.25.1 and stopped warning about itself in later releases,
    # which made it hard to tell an ignored directive from a working
    # one. This form needs 1.25.1 or newer; the modules themselves
    # still build against much older nginx.
    http2 on;

    root ./;

    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
