# NGINX configuration for script/test_header_status.py.
#
# Needs a binary built with script/fault_filter as well as this
# module - script/test-header-status.sh builds one. The
# fault_header_status directive does not exist otherwise, and nginx
# treats an unknown directive as a fatal configuration error, so this
# file will not load against a normal build.

daemon off;
master_process off;

error_log logs/error.log debug;
pid logs/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  types {
    text/html html;
    text/plain txt;
  }
  default_type application/octet-stream;

  pack_zstd on;
  pack_zstd_types text/html text/plain;

  server {
    listen 127.0.0.1:8899;
    server_name localhost;
    root html;

    # The upstream replies chunked with no Content-Length, so the
    # response reaches the filter with its size unknown and the zstd
    # filter holds the headers back to apply pack_zstd_min_length. That is
    # the only state from which prepare() calls send_headers, and so
    # the only state where a status coming back from below reaches
    # its "header_rc > NGX_OK" branch.
    location /stream/ {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Same, with a filter below zstd returning a status instead.
    location /fault/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      fault_header_status 415;
    }
  }
}
