# NGINX configuration for script/test_oom.py.
#
# Two locations over the same files: one this module compresses, one
# it is switched off for. The second is the control - it needs no
# encoder, so it keeps answering after an allocation has been refused,
# which is how the driver tells "this response failed" apart from "the
# worker is gone".
#
# Do not run this by hand: script/test-oom.sh owns the build, and
# test_oom.py owns the process, the fixtures and the port.

daemon off;
master_process off;

# Without this the fault hook never sees the variable. nginx replaces
# the environment on its way into the cycle - ngx_set_environment, from
# ngx_single_process_cycle here and ngx_worker_process_init otherwise -
# keeping only what an "env" directive names, plus TZ.
env PACK_ZSTD_FAULT_AFTER;

error_log logs/error.log debug;
pid logs/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  types {
    text/html html;
  }
  default_type application/octet-stream;

  server {
    listen 127.0.0.1:8899;
    server_name localhost;
    root html;

    location /zstd/ {
      alias html/;
      pack_zstd on;
      pack_zstd_types text/html;
      pack_zstd_min_length 1;
    }

    location /plain/ {
      alias html/;
      pack_zstd off;
    }
  }
}
