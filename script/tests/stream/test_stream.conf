# NGINX configuration for script/tests/stream/test_stream.py.
#
# Accept-Encoding parsing and static file serving, and the parts of
# the filter module a plain request/response suite cannot reach:
# streaming (unknown Content-Length) responses, and the lifetime of
# the Zstandard encoder instance. Do not run this by hand -
# test_stream.py owns the process lifecycle, the fixtures and the
# port preflight.
#
# "debug" is accepted by release builds too (it simply produces no
# debug output); the driver skips the memory tests unless nginx has
# --with-debug.

daemon off;
master_process off;

error_log logs/error.log debug;
pid logs/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  types {
    text/html html;
    # ssi_types defaults to text/html alone, so without this the SSI
    # filter would leave the include directive in the page as text.
    text/html shtml;
    text/plain txt;
    text/css css;
    application/javascript js;
    # The corpus's api.json, and the one type here that is not
    # text/*: without it the file falls to default_type and the
    # filters decline it whatever pack_*_types says.
    application/json json;
    # The corpus's feed.pb: what GTFS-realtime servers send, and the
    # only content here that is not text of some kind.
    application/x-protobuf pb;
  }
  default_type application/octet-stream;

  gzip_vary on;

  pack zstd;
  pack_zstd_level 6;
  # pack_zstd_window is deliberately left unset so the suite exercises
  # the compiled-in default.
  pack_types text/html text/plain text/css application/javascript
             application/json application/x-protobuf;

  # Brotli is deliberately left out of "pack" here and named only in
  # the "br-" locations below, each of which writes its own complete
  # "pack" list rather than adding Brotli to what this level already
  # resolved to - "pack" is all-or-nothing per location. Enabling both
  # at this level would also make every existing zstd-only test's
  # result depend on Brotli rather than on what it is testing.
  # pack_types is shared, so a location that lists "br" in "pack"
  # inherits it from here regardless.
  # pack_zstd_min_length is deliberately left unset so the suite
  # exercises the compiled-in default.

  # The abort tests drive disconnects explicitly, so nothing here
  # should time out on its own.
  send_timeout 60s;

  server {
    listen 127.0.0.1:8899;
    server_name localhost;
    root html;

    # The one HTTP/2 check in test_stream.py wants this. nginx sniffs
    # the HTTP/2 client preface on the connection itself, so a plain
    # HTTP/1.1 request - what http.client, and so every other test
    # here, sends - is unaffected by this being on.
    http2 on;

    # pack_static, which is otherwise untested. open_file_cache is
    # on deliberately: it is the only caller that hashes the
    # constructed ".zst" path over its ngx_str_t length, so it is what
    # would notice if that length ever stopped matching the string.
    # "pack off" keeps both filters out of the way, so what arrives
    # is the pre-compressed file or nothing.
    location /static/ {
      alias html/;
      pack off;
      pack_static on;
      open_file_cache max=16 inactive=60s;
      open_file_cache_errors on;
    }

    # SSI, so a subrequest reaches /subreq/ below.
    location /ssi/ {
      alias html/;
      pack off;
      ssi on;
    }

    # The include target, and "always" deliberately: that is the only
    # setting under which a subrequest can reach the probe at all,
    # since "on" goes through ngx_http_pack_claim_request, which turns
    # a subrequest away on its own. Without preflight's own check this
    # location would splice raw brotli into the middle of the SSI page,
    # under a Content-Type that says text and with no Content-Encoding
    # anywhere to admit it. One encoding, so no ambiguity warning.
    location /subreq/ {
      alias html/;
      pack off;
      pack_static always;
      pack_static_encodings br;
    }

    # The same files with pack_static_encodings written two ways. The
    # probe follows the order the directive gives, so a client that
    # takes all three is answered differently by each of these, and
    # the pair is what proves the order is the admin's and not the
    # module's own.
    location /order-bgz/ {
      alias html/;
      pack off;
      pack_static on;
      pack_static_encodings br gzip zstd;
    }

    location /order-zgb/ {
      alias html/;
      pack off;
      pack_static on;
      pack_static_encodings zstd gzip br;
    }

    # A subset, in an order that is not the table's either.
    location /order-zg/ {
      alias html/;
      pack off;
      pack_static on;
      pack_static_encodings zstd gzip;
    }

    # The test upstream replies with Transfer-Encoding: chunked and
    # no Content-Length, so with buffering off the body reaches the
    # filter as a stream of unknown size. Re-proxying our own static
    # files would NOT do: nginx forwards the upstream Content-Length,
    # and the filter would still know the response size.
    location /stream/ {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Same upstream and same unknown-length path as /stream/, but with
    # pack_zstd_hint pulled down to its floor. Compared against /stream/
    # itself, this is what tells the directive apart from the compiled-in
    # default reaching the encoder anyway.
    location /small-hint/ {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      pack_zstd_window 256k;
      pack_zstd_hint 16k;
    }

    # The other half of that pair: same window, hint left at its
    # default. Both name a window well above the directive floor on
    # purpose - the hint only ever shrinks windowLog to fit, so at the
    # 16k default there is nothing for it to shrink and the two
    # locations would peak identically whether or not the directive
    # worked.
    location /big-hint/ {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      pack_zstd_window 256k;
    }

    # Same upstream, but with buffering left on, as it is by default.
    # nginx then hands the filter buffers carrying neither "flush"
    # nor "last_buf", which is what lets the filter hold input back
    # until it knows how big the response is. With buffering off
    # (above) every buffer is flush-marked and no deferral is
    # possible.
    location /buffered/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
    }

    # limit_rate makes ngx_http_write_filter hold the response back and
    # return NGX_AGAIN with the buffers still outstanding, which is what
    # a slow client does without depending on kernel socket buffer
    # sizes. The encoder then runs ahead into its other buffers instead
    # of stopping, which is the whole point of pack_zstd_buffers - and the
    # second location pins that by allowing only one.
    location /throttled/ {
      alias html/;
      limit_rate 8k;
    }

    # The size is the compiled-in default spelled out: the directive
    # takes both parameters, as gzip_buffers does, so a location that
    # wants to say something about the count has to name a size too.
    location /throttled-one/ {
      alias html/;
      limit_rate 8k;
      pack_zstd_buffers 1 16k;
    }

    # What test_table_sizing measures: the pairs where capping the
    # tables at the window bites, and one where it must not - 256k at
    # level 3, zstd's own figures already being below the window.
    location /tables-16k-3/ {
      alias html/;
      pack_zstd_window 16k;
      pack_zstd_level 3;
    }

    location /tables-16k-6/ {
      alias html/;
      pack_zstd_window 16k;
      pack_zstd_level 6;
    }

    location /tables-64k-6/ {
      alias html/;
      pack_zstd_window 64k;
      pack_zstd_level 6;
    }

    location /tables-256k-3/ {
      alias html/;
      pack_zstd_window 256k;
      pack_zstd_level 3;
    }

    location /tables-256k-6/ {
      alias html/;
      pack_zstd_window 256k;
      pack_zstd_level 6;
    }

    # The other half of the same directive, checked by what it does
    # rather than by whether it parses: a round can commit at most one
    # buffer's worth, so a size well above the compiled-in default is
    # visible in the output trace. Larger rather than smaller because
    # the floor is the default - only a bigger size tells the two
    # apart.
    location /wide-buffers/ {
      alias html/;
      pack_zstd_buffers 4 64k;
    }

    # The upstream writes many small chunks in one send, so nginx reads
    # them together and ngx_http_proxy_chunked_filter turns them into a
    # single chain of flush-marked buffers - one per chunk. Buffering
    # must be off for that filter to mark them at all. This is the
    # chain the fold collapses into one block.
    location /burst {
      proxy_pass http://127.0.0.1:8901/burst;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # The same shape carrying more than the fold may hold, so the bound
    # has to cut the chain rather than swallow it. proxy_buffer_size is
    # raised because that is what decides how much arrives as one chain,
    # and at the default it would split the burst on its own - which
    # would cut blocks for a reason that is nginx's rather than ours.
    location /burst-wide/ {
      proxy_pass http://127.0.0.1:8901/burst-wide;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_buffer_size 256k;
      proxy_buffers 8 256k;
      proxy_read_timeout 300s;
    }

    # Lets the upstream pick the response status, so the filter's
    # status handling can be checked against a real proxied response
    # rather than one nginx generated itself.
    location /status/ {
      proxy_pass http://127.0.0.1:8901/status/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
    }

    # Buffering on, so nginx hands the filter buffers with no flush
    # marker. Used to check time to first byte on a slowly-produced
    # response.
    location /dribble {
      proxy_pass http://127.0.0.1:8901/dribble;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
    }

    # The only location that reaches ngx_http_pack_check_vary.
    #
    # "gzip_vary off" is what makes it reachable, and is the whole
    # reason this location exists rather than reusing /stream/. With
    # gzip_vary on - as it is at http level above - set_vary raises
    # nginx's own flag and returns, so the loop that walks the
    # response headers looking for an existing "Vary: Accept-Encoding"
    # never runs. Turning it off here is not a preference: it is the
    # only configuration under which this code executes at all.
    #
    # Buffering off keeps the response out of the deferral path, so a
    # failure in these tests can only be about headers.
    location /vary/ {
      proxy_pass http://127.0.0.1:8901/vary/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      gzip_vary off;
    }

    # An upstream that sends a little and then stalls forever. Lets a
    # client disconnect while the filter is parked waiting for more
    # input, which is the only route to the pool cleanup handler.
    location /slow {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # The zstd half of the smallest-window pair. Its floor is 16k,
    # which emits blocks far larger than postpone_output, so this has
    # never been able to deadlock the way Brotli's 1k window did - but
    # the test is registered for both codecs, and an encoder that
    # cannot finish a response at its own smallest window is a bug
    # whichever library is underneath.
    location /tiny-window/ {
      alias html/;
      pack_zstd_level 1;
      pack_zstd_window 16k;
    }

    # ---------------------------------------------------------------
    # Brotli twins of the locations above.
    #
    # The structural tests - stalls, buffer counts, teardown,
    # allocator balance - are the same test for either encoder, so
    # they are registered once per codec and reach their location
    # through Codec.path(). These are the other end of that: the same
    # configuration with "pack" naming Brotli alone instead of the
    # http block's "pack zstd;", under a "br-" prefix - one codec at a
    # time, so which filter claims the response is never in question.
    # ---------------------------------------------------------------

    # A plain static file, compressed by Brotli instead of zstd. The
    # zstd half of this pair is the server root itself, which the http
    # block's "pack zstd;" already covers, so there is no
    # /zstd-static/ to match - see Codec.file().
    location /br-static/ {
      alias html/;
      pack br;
    }

    # The one location with gzip and both filters listed in "pack" -
    # zstd first as everywhere else, Brotli named alongside it here.
    # Which of them claims a response is then settled by "pack"'s
    # order rather than by what the client asked for;
    # test_codec_precedence pins the outcome.
    #
    # gzip needs no gzip_types: text/html is always compressed, and
    # naming it draws a duplicate-MIME warning.
    # pack_*_proxied: /proxied-default/ leaves it at its "off"
    # default, /proxied-any/ opts in. Both filters on, so one pair of
    # locations covers the directive for each.
    # Upstream replies carrying Cache-Control, for the no-transform
    # gate. Both filters on, so one location covers the pair.
    # The same body delivered in pieces of a named size. nginx
    # derives proxy_buffer_size from the page size by default - 4k
    # on Linux, 16k on Apple Silicon - so a suite that took the
    # default would exercise a different shape on each host and
    # none of them deliberately. Naming all three fixes that.
    location /bufsize-1k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 1k;
      proxy_buffers 8 1k;
      pack zstd;
    }

    location /bufsize-4k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      pack zstd;
    }

    location /bufsize-16k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      pack zstd;
    }

    location /br-bufsize-1k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 1k;
      proxy_buffers 8 1k;
      pack br;
    }

    location /br-bufsize-4k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      pack br;
    }

    location /br-bufsize-16k/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      pack br;
    }

    location /cc/ {
      proxy_pass http://127.0.0.1:8901/cc/;
      proxy_set_header Accept-Encoding "";
      pack zstd br;
    }

    location /enc/ {
      proxy_pass http://127.0.0.1:8901/enc/;
      proxy_set_header Accept-Encoding "";
      pack zstd br;
    }

    location /proxied-default/ {
      alias html/;
      pack zstd br;
    }

    location /proxied-any/ {
      alias html/;
      pack zstd br;
      pack_proxied any;
    }

    location /all/ {
      alias html/;
      pack zstd br;
      gzip on;
    }

    # "pack" lists zstd first, so it still runs first and still wins
    # whenever a client actually names it; Brotli's "=always" is only
    # ever reached once zstd has declined. "gzip on" stays, the same
    # as /all/, so a client that only accepts gzip still proves
    # something: whether Brotli or gzip claims it.
    location /always/ {
      alias html/;
      pack zstd br=always;
      gzip on;
    }

    # Nothing but Brotli's own "always" claim can produce a
    # Content-Encoding here, so this is the directive on its own
    # terms rather than mixed with the codec-precedence question
    # /always/ above answers.
    location /brotli-always/ {
      alias html/;
      pack br=always;
    }

    # zstd's mirror of /brotli-always/: nothing but zstd's own
    # "always" claim can produce a Content-Encoding here.
    location /zstd-always/ {
      alias html/;
      pack zstd=always;
    }

    # Brotli ranked first, zstd second, neither "=always": the plain
    # counterpart to /all/'s "pack zstd br;" with the two
    # swapped, and nothing else. A client that names "br" gets
    # Brotli even though zstd would run first physically; one that
    # names only "zstd" falls through to it since Brotli declined;
    # one that names neither gets nothing, since there is no
    # "=always" floor here to catch it.
    location /brotli-zstd-plain/ {
      alias html/;
      pack br zstd;
    }

    # The one location where "pack"'s listed order actually reverses
    # who wins: Brotli ranked first, zstd second and "=always". zstd
    # still runs first in the physical chain no matter what "pack"
    # says, so this is what proves the order is real rather than
    # cosmetic - zstd's own header filter has to ask whether Brotli
    # would claim the response before deciding anything of its own,
    # deferring to it even though zstd itself would run first. A
    # client that names only "br" gets Brotli, one that names only
    # "zstd" (or nothing at all) falls through to zstd's unconditional
    # floor, and an explicit "br;q=0" also falls through to it, the
    # same way an explicit refusal never stops an "=always" codec
    # anywhere else in this suite.
    location /brotli-zstd-always/ {
      alias html/;
      pack br zstd=always;
    }

    location /br-stream/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      pack br;
    }

    location /br-buffered/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
      pack br;
    }

    location /br-throttled/ {
      alias html/;
      limit_rate 8k;
      pack br;
    }

    location /br-throttled-one/ {
      alias html/;
      limit_rate 8k;
      pack br;
      pack_brotli_buffers 1 16k;
    }

    location /br-wide-buffers/ {
      alias html/;
      pack br;
      pack_brotli_buffers 4 64k;
    }

    # The Brotli half of the status pair, so the filter's status
    # handling is checked against a real proxied response for either
    # encoder rather than one nginx generated itself.
    location /br-status/ {
      proxy_pass http://127.0.0.1:8901/status/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      pack br;
    }

    # The Brotli half of the flush-folding pair. Same upstream and
    # same buffering-off as /burst, so the chunked filter marks every
    # chunk and the whole burst arrives as one chain of flush-marked
    # buffers.
    # Level 4 rather than the default 1, and that is the whole point
    # of naming it. Brotli's quality 0 and 1 take a "fast" path that
    # compresses whatever input a call brings into a meta-block of its
    # own instead of accumulating across calls, so folding a flush
    # into a PROCESS merges nothing there, at any window. Folding is a
    # real mechanism worth guarding, so the test that guards it asks
    # for a quality that can fold.
    location /br-burst/ {
      proxy_pass http://127.0.0.1:8901/burst;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      pack br;
      pack_brotli_level 4;
    }

    # Buffering on, so nginx hands the filter buffers with no flush
    # marker and the encoder has to decide for itself when to emit.
    # For Brotli that is the "the caller wants output and a block is
    # part-filled, so run a FLUSH" branch, which nothing else here
    # reaches. Flush *folding* has no twin - the zstd encoder folds a
    # run of flush markers into one block and this one does not, and
    # the test for it counts blocks in a zstd frame header anyway.
    location /br-dribble/ {
      proxy_pass http://127.0.0.1:8901/dribble;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
      pack br;
    }

    # An upstream that sends a little and then stalls forever, so a
    # client can disconnect while the filter is parked waiting for
    # input. That is the only route to the pool cleanup handler, which
    # is a different teardown path from the one a finished response
    # takes and has to be reached for either encoder.
    location /br-slow/ {
      proxy_pass http://127.0.0.1:8901/slow;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      pack br;
    }

    # The regression location for the deadlock that the single-buffer
    # design had. An output block shorter than nginx's 1460-byte
    # postpone_output is held by the write filter waiting for more;
    # while it holds one, an encoder that had handed out its only
    # buffer could not produce the "more" being waited for, and
    # neither side moved again - the worker sat at 0.0% CPU until the
    # client gave up.
    #
    # The window is the floor the directive allows rather than the 1k
    # that first showed this, since 1k is no longer configurable. What
    # keeps the test biting is the body: the fixture it is served
    # compresses about 130x, so a block's worth of it comes out well
    # under postpone_output even at 16k. A poorly-compressible body
    # would not reach the condition at this window at all.
    #
    # postpone_output is deliberately left at its default here.
    # Setting it to 0 is what made the deadlock go away, so a test
    # that set it would be testing nothing.
    location /br-tiny-window/ {
      alias html/;
      pack br;
      pack_brotli_level 1;
      pack_brotli_window 16k;
    }
  }
}
